_target_: planning.mpc.MPCPlanner
max_iter: 10 # unlimited if null
n_taken_actions: 1
sub_planner:
  target: planning.gd.GDPlanner
  horizon: 5
  action_noise: 0.003
  sample_type: 'randn' # 'zero' or 'randn'
  lr: 0.1 
  opt_steps: 1000
  eval_every: 10
  var_scale: 0.5
  clip_value: 2.0
  action_mag_coeff: 0.1

name: mpc_gd