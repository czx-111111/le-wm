# @package _global_
defaults:
  - lewm_rope_s1
  - _self_

# 原来的 S2（共享 4×4 粗细表 + 动态 n_lo + 逐层注入），去掉相对偏置。
output_model_name: lewm_rope_s2
subdir: ${output_model_name}_${now:%Y%m%d_%H%M%S}

wm:
  pos_mode: nibble
  inject_every_layer: true
  n_lo_mode: attn
  use_relative_bias: false
  abs_mode: shared
