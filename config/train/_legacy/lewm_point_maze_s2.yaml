# @package _global_
defaults:
  - lewm_point_maze_s1
  - _self_

# S2 消融：动态 n_lo + 逐层注入；去掉分级相对偏置。
# 训练：epoch=150；仍存 best；正式评估用最后一轮（*_last_object / *_epoch_{max}）。
output_model_name: lewm_point_maze_s2
subdir: ${output_model_name}_${now:%Y%m%d_%H%M%S}

save_object_every_n_epochs: 10

# devices 由 CUDA_VISIBLE_DEVICES 映射；此处 [0] 表示可见 GPU 列表中的第 0 张
trainer:
  max_epochs: 150
  devices: [0]

wm:
  pos_mode: nibble
  inject_every_layer: true
  n_lo_mode: attn
  use_relative_bias: false
  abs_mode: shared
