defaults:
  - _self_
  - data: agibot_task5015

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 4
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 50
  devices: [4, 5, 6, 7]
  accelerator: gpu
  strategy: ddp
  # bf16 混合精度: 显存约为 fp32 的一半, 对 LeWM 训练效果影响可忽略
  precision: bf16
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  # 等效 batch = batch_size * accumulate_grad_batches = 16 * 8 = 128 (每张卡)
  # 4 卡全局等效 batch = 128 * 4 = 512
  accumulate_grad_batches: 8

loader:
  # 物理 batch 从 128 降到 16, 通过梯度累积保持等效 batch=128, 显著降低峰值显存
  batch_size: 16
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 2
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: derorice_1-taiyuan-university-of-technology
    project: le-wm-test
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
