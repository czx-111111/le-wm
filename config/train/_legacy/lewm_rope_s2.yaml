# @package _global_
defaults:
  - lewm_rope_s1
  - _self_

# 原来的 S2（共享 4×4 粗细表 + 动态 n_lo + 逐层注入），去掉相对偏置。
# 训练：epoch=S1×1.5；仍存 best；正式评估用最后一轮（*_last_object / *_epoch_{max}）。
output_model_name: lewm_rope_s2
subdir: ${output_model_name}_${now:%Y%m%d_%H%M%S}

save_object_every_n_epochs: 10

trainer:
  max_epochs: 150

wm:
  pos_mode: nibble
  inject_every_layer: true
  n_lo_mode: attn
  use_relative_bias: false
  abs_mode: shared
