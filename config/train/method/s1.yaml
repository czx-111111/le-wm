# @package _global_
# S1：query 读出 + 全局 CLS + learned PE
wm:
  type: lewm
  token_mode: spatial16
  num_spatial_tokens: 16
  spatial_grid: 4
  pool_mode: query
  include_global_token: true
  pos_mode: learned
  inject_every_layer: false

plan:
  cost_mode: m_task_terminal
  m_task_mode: eps
  m_task_threshold: 0.08
  m_task_topk: 4
  m_task_assume_normalized: true
