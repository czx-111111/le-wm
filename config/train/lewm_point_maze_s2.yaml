# @package _global_
defaults:
  - lewm_point_maze_s1
  - _self_

# S2 消融：动态 n_lo + 逐层注入；去掉分级相对偏置。
output_model_name: lewm_point_maze_s2
subdir: ${output_model_name}_${now:%Y%m%d_%H%M%S}

# 与文档一致：单卡 0（S1 的 point_maze 曾改到 devices:[1]，这里显式拉回）
trainer:
  devices: [0]

wm:
  pos_mode: nibble
  inject_every_layer: true
  n_lo_mode: attn
  use_relative_bias: false
  abs_mode: shared
