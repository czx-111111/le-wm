# @package _global_
defaults:
  - _self_
  - data: granular

# 每次新跑用时间戳子目录 + 独立 wandb run，避免覆盖旧结果
output_model_name: lewm_granular_v1
subdir: ${output_model_name}_${now:%Y%m%d_%H%M%S}

num_workers: 4
# 仅在 granular_train.h5 内部再切 train/val；与 granular_eval.h5 完全分离
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True
# 完整模型 object 每 N 个 epoch 存一次（最后一轮仍会存）；最优另存 *_best_object.ckpt
save_object_every_n_epochs: 10

checkpoint:
  monitor: validate/pred_loss
  mode: min
  save_top_k: 1

trainer:
  max_epochs: 100
  devices: [3, 4]
  accelerator: gpu
  strategy: ddp
  precision: bf16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  # 全局等效 batch = 16 × 4 × 2卡 = 128
  accumulate_grad_batches: 4

loader:
  batch_size: 16
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 2
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5.0e-5
  weight_decay: 1.0e-3

wandb:
  enabled: True
  config:
    entity: derorice_1-taiyuan-university-of-technology
    project: le-wm-test
    name: ${subdir}
    id: ${subdir}
    resume: never
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192
  action_dim: 4

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.05
    kwargs:
      knots: 17
      num_proj: 1024
